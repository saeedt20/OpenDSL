name: Mirror verified upstream source for v1.0.0

on:
  workflow_dispatch:

permissions: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download, verify and attach the original ASUS archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          archive=GPL_DSL-N12E_C1_v1123743.zip
          curl --fail --location --retry 2 --output "$archive" \
            "https://dlcdnets.asus.com/pub/ASUS/wireless/DSL-N12E_C1/$archive"
          printf '%s  %s\n' \
            adfddf4b12489df6ab10b1b627678dac609da2f228aeb37ecbcb3bccb0a39f84 \
            "$archive" | sha256sum --check -
          gh api --method POST --header 'Content-Type: application/zip' \
            "https://uploads.github.com/repos/$GH_REPO/releases/424619744/assets?name=$archive" \
            --input "$archive" --jq '{name, size, digest, state}'
